<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winux Nomacs</title>
  <meta name="description" content="Eyes up guardian.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/gargoyle-707.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>

  <main class="stage">
    <h1 class="line line--top"><a class="banner-link" href="https://github.com/winuxnomacs">Winux Nomacs</a></h1>

    <div class="float" id="head">
      <div class="tilt" id="tilt">
        <img class="gargoyle" src="assets/img/gargoyle-cutout-707.webp"
             srcset="assets/img/gargoyle-cutout-707.webp 707w, assets/img/gargoyle-cutout-1414.webp 1414w"
             sizes="min(70vmin, 707px)" width="707" height="707"
             alt="A stone gargoyle looking upward, one eye glowing gold">
        <span class="eye-glow" aria-hidden="true"></span>
      </div>
    </div>

    <p class="line quote" id="quote"></p>
  </main>

  <button class="back line" id="back" type="button">← Back</button>
  <div class="marker marker--sun" id="sun-marker" aria-hidden="true">
    <span class="marker-ring"></span>
    <span class="marker-label">The Sun<small>26,700 light-years from the centre</small></span>
  </div>
  <div class="planet-labels" id="planet-labels" aria-hidden="true"></div>
  <div class="marker marker--earth" id="earth-marker" aria-hidden="true">
    <span class="marker-ring"></span>
    <span class="marker-label">You are here<small id="earth-date">The Earth</small><small id="earth-distance"></small></span>
  </div>
  <p class="line tour-note" id="tour-note" aria-hidden="true"></p>
  <p class="sr-only" id="tour-status" role="status"></p>

  <script src="main.js" defer></script>
  <script src="quotes.js" defer></script>
</body>
</html>
